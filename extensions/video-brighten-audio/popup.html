<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 16px; font: 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .val { font-weight: bold; }
  input[type=range] { width: 100%; cursor: pointer; margin: 0 0 18px; }
  label.auto { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 6px; }
  .tip { color: #888; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="row"><span>☀ 画面提亮</span><span class="val" id="v1">0</span></div>
  <input type="range" id="s1" min="0" max="100" value="0">

  <div class="row"><span>🔊 声音放大</span><span class="val" id="v2">0</span></div>
  <input type="range" id="s2" min="0" max="100" value="0">

  <label class="auto"><input type="checkbox" id="auto"> 自动拉平音量（忽大忽小时打开）</label>

  <div class="tip">画面提亮用的是和播放器 Gamma 一样的亮度曲线：只抬暗部，亮处不爆白、不刺眼。声音放大最高约 +24 dB，自带防破音限幅；自动拉平适合人声小、爆炸声大的片子。0 档即恢复原样。若声音接入后听不到，请刷新网页后重试。</div>
  <script src="popup.js"></script>
</body>
</html>
